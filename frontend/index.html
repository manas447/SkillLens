<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkillLens – Employability Analyzer</title>
   <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #e6fffa, #ebf4ff);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #fff;
      width: 900px;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin: auto;
    }

    h1 {
      grid-column: span 2;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      grid-column: span 2;
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      margin-top: 10px;
      display: block;
    }

     input {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
     .card {
  background: #fff;
  width: 900px;
  border-radius: 14px;
  padding: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
}

    
    button {
      grid-column: span 2;
      margin-top: 20px;
      padding: 12px;
      font-size: 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    .result {
      grid-column: span 2;
      margin-top: 30px;
      text-align: center;
    }

.score-circle {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: #4f46e5;
  color: white;
  font-size: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 30px auto 20px;
  font-weight: 700;
  box-shadow: 0 20px 40px rgba(79,70,229,0.4);
}



    .confidence {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .gaps {
      margin-top: 15px;
    }

     .badge {
  display: inline-block;
  background: #eef2ff;
  color: #3730a3;
  padding: 8px 16px;
  border-radius: 999px;
  margin: 6px;
  font-size: 14px;
  font-weight: 600;
}


.next-steps {
  margin-top: 15px;
  font-size: 14px;
  color: #555;
}

.divider {
  grid-column: span 2;
  height: 1px;
  background: #e5e7eb;
  margin: 10px 0 20px;
}
label:first-of-type {
  margin-top: 0;
}

    .badge {
      display: inline-block;
      background: #f1f3f5;
      color: #333;
      padding: 6px 12px;
      border-radius: 20px;
      margin: 5px;
      font-size: 14px;
    }
    .input-group {
  margin-bottom: 0;
}
 .page {
  width: 100%;
  display: flex;
  justify-content: center;
}

.card {
  max-width: 880px;
}


  </style>
</head>
<body>

<div class="card">
  <h1>🧠 SkillLens</h1>
    <div class="role-group">
      <div class="input-group">
  <label>Target Role</label>
  <select id="role">
    <option value="ml">ML Intern</option>
    <option value="backend">Backend Intern</option>
    <option value="analyst">Data Analyst</option>
  </select>
      </div>
 
 
      <div>
    <label>CGPA</label>
    <input id="cgpa" type="number" step="0.1" value="8.0">
<div class="subtitle">
  AI-powered Employability & Skill Gap Analyzer<br>
  <small style="color:#777;">For students, placement cells & training institutes</small>
</div>

    <label>Projects</label>
    <input id="projects" type="number" value="3">

    <label>Internships</label>
    <input id="internships" type="number" value="1">

    <label>Certifications</label>
    <input id="certifications" type="number" value="2">
  </div>

  <div>
    <label>Python (0/1)</label>
    <input id="python" type="number" value="1">

    <label>ML (0/1)</label>
    <input id="ml" type="number" value="1">

    <label>SQL (0/1)</label>
    <input id="sql" type="number" value="1">

    <label>Communication (0/1)</label>
    <input id="communication" type="number" value="1">
  </div>

  <button onclick="predict()">Analyze Employability</button>
  <hr style="margin:25px 0; border:none; border-top:1px solid #e5e7eb;">

   <div class="divider"></div>
   <div class="result" id="result"></div>
<div id="error" style="color:#b91c1c; text-align:center; margin-top:10px;"></div>

</div>

<script>
function predict() {
    document.getElementById("error").innerText = "";

if (cgpa.value < 0 || cgpa.value > 10) {
  error.innerText = "CGPA must be between 0 and 10.";
  return;
}

if (projects.value < 0 || internships.value < 0 || certifications.value < 0) {
  error.innerText = "Experience values cannot be negative.";
  return;
}

  fetch("http://127.0.0.1:5000/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      cgpa: Number(cgpa.value),
      projects: Number(projects.value),
      internships: Number(internships.value),
      certifications: Number(certifications.value),
      python: Number(python.value),
      ml: Number(ml.value),
      sql: Number(sql.value),
      communication: Number(communication.value)
    })
  })
  .then(res => res.json())
  .then(data => {
    let roleText = {
  ml: "ML Intern",
  backend: "Backend Intern",
  analyst: "Data Analyst"
}[role.value];

    let badges = data.skill_gaps.length
      ? data.skill_gaps.map(g => `<span class="badge">${g}</span>`).join("")
      : `<span class="badge">No major gaps</span>`;


    document.getElementById("result").innerHTML = `
      <div class="score-circle">${data.employability_score}%</div>
      <div class="confidence">📊 Confidence: <b>${data.confidence}</b></div>
      <div class="status">✅ ${data.label} for ${roleText}</div>
      <div class="gaps">${badges}</div>
      <div class="next-steps">
      <div style="font-size:12px; color:#777; margin-top:10px;">
  This is a decision-support system, not a final hiring verdict.
</div>
  
  Suggested next steps: Focus on the highlighted skill gaps over the next 8–12 weeks.
</div>

    `;
  });
}
</script>
<div style="
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: #888;
">
  SkillLens • Explainable AI for Career Readiness
</div>

</body>
</html>
